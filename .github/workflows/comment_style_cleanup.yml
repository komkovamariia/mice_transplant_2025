name: Comment style cleanup

on:
  push:
    branches:
      - repository-style-cleanup

permissions:
  contents: write

jobs:
  normalize-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize ordinary source comments
        run: python scripts/normalize_comments.py --write
      - name: Verify Python syntax
        run: python -m compileall -q src scripts tests
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit normalized comments
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests .github/workflows/validation.yml config/example.env environment.yml requirements.txt
          git commit -m "Normalize source comments"
          git push

name: Finalize parallel notebook patch

on:
  push:
    branches:
      - reproducible-article-environment

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducible-article-environment

      - name: Apply final execution fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def text(cell):
              src = cell.get('source', '')
              return ''.join(src) if isinstance(src, list) else src
          def put(cell, value):
              src = cell.get('source', '')
              cell['source'] = value.splitlines(keepends=True) if isinstance(src, list) else value
          def get_cell(nb, cid):
              return next(c for c in nb['cells'] if c.get('id') == cid)
          def save(path, nb):
              Path(path).write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')

          # Pre-existing execution bug: enr is mirpy.EnrichmentResult, while enriched is the
          # exact q<0.05/fold>1 DataFrame that this motif block is meant to subset.
          p = 'mirpy_analysis.ipynb'
          nb = load(p)
          c = get_cell(nb, 'f785b95b')
          s = text(c).replace(
              'sub = enr[enr["v_gene"]==v]',
              'sub = enriched[enriched["v_gene"]==v].copy()',
          )
          put(c, s)
          save(p, nb)

          # Study2 may be launched from repo root or from study2_alloreactivity/.
          p = 'study2_alloreactivity/alloreactivity_study.ipynb'
          nb = load(p)
          c = get_cell(nb, '386b65e3')
          s = text(c)
          old = 'import os, sys, warnings, pickle\nfrom article_runtime import configure_runtime\n'
          new = (
              'import os, sys, warnings, pickle\n'
              'from pathlib import Path\n'
              '_cwd = Path.cwd().resolve()\n'
              'if not (_cwd / "article_runtime.py").exists() and (_cwd.parent / "article_runtime.py").exists():\n'
              '    sys.path.insert(0, str(_cwd.parent))\n'
              'from article_runtime import configure_runtime\n'
          )
          if old in s:
              s = s.replace(old, new, 1)
          put(c, s)
          save(p, nb)

          mir = Path('mirpy_analysis.ipynb').read_text(encoding='utf-8')
          st2 = Path('study2_alloreactivity/alloreactivity_study.ipynb').read_text(encoding='utf-8')
          venn = Path('venn_original.ipynb').read_text(encoding='utf-8')
          assert 'pandas2ri.activate()' not in venn
          assert 'REPSEQ_PATH' not in venn
          assert 'configure_repseq_parallelism(N_WORKERS)' in venn
          assert 'permanova_parallel as permanova' in mir
          assert 'threads=0' not in mir
          assert 'sub = enr[enr["v_gene"]==v]' not in mir
          assert 'mirpy_density_basis.joblib' in mir
          assert 'configure_repseq_parallelism(N_WORKERS)' in st2
          assert 'parallel_map(_hill_one' in st2
          print('Final parallelization invariants OK')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- mirpy_analysis.ipynb study2_alloreactivity/alloreactivity_study.ipynb; then
            echo 'No additional fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mirpy_analysis.ipynb study2_alloreactivity/alloreactivity_study.ipynb
          git commit -m 'Finalize safe parallel notebook execution'
          git push origin HEAD:reproducible-article-environment

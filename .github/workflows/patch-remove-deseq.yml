name: Patch notebook to edgeR-only differential analysis

on:
  push:
    branches:
      - reproducible-article-environment
    paths:
      - .github/workflows/patch-remove-deseq.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducible-article-environment
          fetch-depth: 0

      - name: Remove DESeq2 blocks and keep Fisher plus edgeR comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('venn_original.ipynb')
          nb = json.loads(path.read_text())

          remove_ids = {
              '4e4e708a-790b-4701-a565-a0e9a7a12393',  # DESeq2 heading
              '6ecf3186-4625-4e8f-9267-498c9688aec5',  # DESeq2 explanation
              '4cb17a06-a86f-4f3d-b293-6a1d631aab43',  # DESeq2 explanation
              '56ea50bc-e36f-4d62-b37e-62909157a660',  # DESeq2 execution
          }
          nb['cells'] = [c for c in nb['cells'] if c.get('id') not in remove_ids]

          replacements = {
              'edgeR / DESeq2 / точный тест Фишера': 'edgeR / точный тест Фишера',
              'Дифференциальный счётный анализ: edgeR, DESeq2, тест Фишера': 'Дифференциальный счётный анализ: edgeR, тест Фишера',
              'Сопоставление Fisher / edgeR / DESeq2, консенсусные клонотипы': 'Сопоставление Fisher / edgeR, консенсусные клонотипы',
              '### Устнавливаю edgeR и DESeq2': '### Использую edgeR',
              '### Сравнение Fisher, EdgeR, DESeq2': '### Сравнение Fisher и edgeR',
          }

          for cell in nb['cells']:
              src = ''.join(cell.get('source', []))
              for old, new in replacements.items():
                  src = src.replace(old, new)
              # Remove obsolete DESeq2 setup lines while preserving edgeR/rpy2 setup.
              src = '\n'.join(
                  line for line in src.split('\n')
                  if 'library(DESeq2)' not in line
                  and 'BiocManager::install("DESeq2")' not in line
              )
              if cell.get('source'):
                  cell['source'] = src.splitlines(keepends=True)

          cells = {c.get('id'): c for c in nb['cells']}

          cells['6a1c1da1-43fc-454d-b05b-70720ab8f150']['source'] = '''# Fisher table в удобный вид
          fisher_compare_g1 = fisher_df.reset_index().rename(columns={"index": "feature_id"})[
              ["feature_id", "Fisher_log2FC_g1", "Fisher_p_g1", "Fisher_FDR_g1"]
          ].copy()

          # edgeR: приводим имена к общему формату для прямого сравнения
          edgeR_compare_g1 = edgeR_res_g1.rename(columns={
              "logFC": "edgeR_log2FC_g1",
              "PValue": "edgeR_p_g1",
              "FDR": "edgeR_FDR_g1"
          })[["feature_id", "edgeR_log2FC_g1", "edgeR_p_g1", "edgeR_FDR_g1"]].copy()

          comparison_g1 = fisher_compare_g1.merge(
              edgeR_compare_g1, on="feature_id", how="inner"
          )

          display(comparison_g1.head())
          print(comparison_g1.shape)
          '''.splitlines(keepends=True)

          cells['2c1eba87-7b9a-467e-87e4-61fb6be484dd']['source'] = '''plot_df = comparison_g1[[
              "Fisher_log2FC_g1",
              "edgeR_log2FC_g1"
          ]].replace([np.inf, -np.inf], np.nan).dropna()

          sns.pairplot(plot_df)
          plt.suptitle("Сравнение log2FC между Fisher и edgeR: g1 против контроля", y=1.02)
          plt.show()
          '''.splitlines(keepends=True)

          cells['4c8575c9-8a27-417d-af2a-7e502fd3883f']['source'] = '''consensus_g1 = comparison_g1[
              (comparison_g1["Fisher_FDR_g1"] < 0.05) &
              (comparison_g1["edgeR_FDR_g1"] < 0.05)
          ].copy()

          consensus_g1["mean_log2FC"] = consensus_g1[
              ["Fisher_log2FC_g1", "edgeR_log2FC_g1"]
          ].mean(axis=1)

          consensus_g1 = consensus_g1.sort_values("mean_log2FC", ascending=False)

          display(consensus_g1.head(30))
          '''.splitlines(keepends=True)

          all_source = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'])
          leftovers = [term for term in ('DESeq2', 'deseq_res_g1', 'deseq_compare_g1', 'DESeq2_') if term in all_source]
          if leftovers:
              raise SystemExit(f'Unexpected DESeq2 references remain: {leftovers}')

          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n')
          PY

      - name: Commit patched notebook and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-remove-deseq.yml
          git add venn_original.ipynb
          git commit -m "Use edgeR and Fisher without DESeq2"
          git push origin reproducible-article-environment

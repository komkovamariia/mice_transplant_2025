name: Patch reproducibility notebook

on:
  push:
    branches:
      - reproducible-article-environment

permissions:
  contents: write

jobs:
  patch-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: reproducible-article-environment

      - name: Modernize venn_original.ipynb
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('venn_original.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          changed = []

          # Use the environment-local kernel. No user kernelspec registration is needed.
          nb.setdefault('metadata', {})['kernelspec'] = {
              'display_name': 'Python 3 (ipykernel)',
              'language': 'python',
              'name': 'python3',
          }
          changed.append('kernelspec -> python3')

          for i, cell in enumerate(nb.get('cells', [])):
              if cell.get('cell_type') != 'code':
                  continue

              source = cell.get('source', [])
              source_is_list = isinstance(source, list)
              text = ''.join(source) if source_is_list else source
              original = text

              # repseq is installed by environment.yml from a fixed GitHub commit.
              # Remove historical machine-specific sys.path manipulation.
              lines = text.splitlines(keepends=True)
              filtered = []
              skip_indented_path_line = False
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('#REPSEQ_PATH ='):
                      continue
                  if stripped.startswith('REPSEQ_PATH ='):
                      continue
                  if stripped == 'if REPSEQ_PATH not in sys.path:':
                      skip_indented_path_line = True
                      continue
                  if skip_indented_path_line and stripped.startswith('sys.path.insert('):
                      skip_indented_path_line = False
                      continue
                  skip_indented_path_line = False
                  if stripped.startswith('sys.path.append(REPSEQ_PATH'):
                      continue
                  filtered.append(line)
              text = ''.join(filtered)

              # rpy2 >= 3.6 removed pandas2ri.activate()/deactivate().
              # Use an explicit local pandas conversion context instead.
              text = text.replace('pandas2ri.activate()\n', '')

              old_py2rpy = (
                  'ro.globalenv["countData"] = pandas2ri.py2rpy(countData_g1)\n'
                  'ro.globalenv["coldata"] = pandas2ri.py2rpy(coldata_g1.reset_index(drop=True))\n'
              )
              new_py2rpy = (
                  'with (ro.default_converter + pandas2ri.converter).context():\n'
                  '    converter = ro.conversion.get_conversion()\n'
                  '    ro.globalenv["countData"] = converter.py2rpy(countData_g1)\n'
                  '    ro.globalenv["coldata"] = converter.py2rpy(coldata_g1.reset_index(drop=True))\n'
              )
              text = text.replace(old_py2rpy, new_py2rpy)

              text = text.replace(
                  'edgeR_res_g1 = pandas2ri.rpy2py(ro.globalenv["edgeR_table"])\n',
                  'with (ro.default_converter + pandas2ri.converter).context():\n'
                  '    edgeR_res_g1 = ro.conversion.get_conversion().rpy2py(ro.globalenv["edgeR_table"])\n'
              )
              text = text.replace(
                  'deseq_res_g1 = pandas2ri.rpy2py(ro.globalenv["deseq_table"])\n',
                  'with (ro.default_converter + pandas2ri.converter).context():\n'
                  '    deseq_res_g1 = ro.conversion.get_conversion().rpy2py(ro.globalenv["deseq_table"])\n'
              )

              if text != original:
                  changed.append(f'cell {i}')
                  cell['source'] = text.splitlines(keepends=True) if source_is_list else text

          serialized = json.dumps(nb, ensure_ascii=False, indent=1) + '\n'
          path.write_text(serialized, encoding='utf-8')

          # Fail loudly if any obsolete rpy2 activation or local repseq path remains.
          final = path.read_text(encoding='utf-8')
          assert 'pandas2ri.activate()' not in final
          assert 'REPSEQ_PATH' not in final
          assert 'pandas2ri.py2rpy(' not in final
          assert 'pandas2ri.rpy2py(' not in final
          assert nb['metadata']['kernelspec']['name'] == 'python3'
          print('Patched:', ', '.join(changed))
          PY

      - name: Commit notebook patch
        shell: bash
        run: |
          if git diff --quiet -- venn_original.ipynb; then
            echo 'Notebook already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add venn_original.ipynb
          git commit -m 'Modernize rpy2 conversion and remove local repseq path'
          git push origin HEAD:reproducible-article-environment

name: Apply journal-grade project refactor

on:
  push:
    branches:
      - reproducible-article-environment
    paths:
      - .github/refactor_kick
      - .github/workflows/refactor-apply.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducible-article-environment
          fetch-depth: 0

      - name: Extract and install refactored project tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/refactor-journal-layout.yml').read_text()
          payload = src.split("<<'PAYLOAD'\n", 1)[1].split("\nPAYLOAD", 1)[0].strip()
          Path('/tmp/article_refactor.tar.gz.b64').write_text(payload)
          PY
          mkdir -p /tmp/article_refactor
          base64 -d /tmp/article_refactor.tar.gz.b64 > /tmp/article_refactor.tar.gz
          tar -xzf /tmp/article_refactor.tar.gz -C /tmp/article_refactor

          cp article_runtime.py /tmp/article_refactor/src/runtime.py

          rm -rf approaches src scripts docs config outputs supplementary figures study2_alloreactivity
          rm -f PARALLEL_EXECUTION.md article_runtime.py venn_original.ipynb mirpy_analysis.ipynb results_summary.ipynb
          rm -f results_tables.xlsx
          rm -f "методология_mirpy.docx"

          cp -a /tmp/article_refactor/. .
          chmod +x scripts/run_analysis.py scripts/validate_repository.py

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/*.py scripts/*.py
          python scripts/validate_repository.py

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/refactor_kick
          git rm .github/workflows/refactor-apply.yml
          git rm .github/workflows/refactor-journal-layout.yml
          git add -A
          git commit -m "Refactor analyses into stratified journal-grade pipeline"
          git push origin reproducible-article-environment

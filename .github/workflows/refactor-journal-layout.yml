name: Refactor article repository for journal-grade execution

on:
  push:
    branches:
      - reproducible-article-environment
    paths:
      - .github/workflows/refactor-journal-layout.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducible-article-environment
          fetch-depth: 0

      - name: Install refactored project tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/article_refactor
          cat > /tmp/article_refactor.tar.gz.b64 <<'PAYLOAD'

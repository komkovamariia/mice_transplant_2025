name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "matplotlib==3.10.1" \
            "nbclient>=0.10,<0.11" \
            "nbformat==5.10.4" \
            "numpy==2.5.1" \
            "pandas==3.0.3" \
            joblib \
            "threadpoolctl==3.6.0" \
            pyarrow \
            "pytest>=8.3,<9" \
            "scipy==1.18.0"

      - name: Validate repository contract
        run: python scripts/validate_repository.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Run regression tests
        run: python -m pytest -q

  edger-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install edgeR
        shell: Rscript {0}
        run: |
          install.packages("BiocManager")
          BiocManager::install("edgeR", ask = FALSE, update = FALSE)
      - name: Install Python bridge
        run: python -m pip install "numpy==2.5.1" "pandas==3.0.3" "rpy2==3.6.7" "pytest>=8.3,<9"
      - name: Fit the notebook edgeR cell on synthetic counts
        run: python -m pytest -q tests/test_edger_integration.py
